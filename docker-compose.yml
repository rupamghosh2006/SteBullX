services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://stebullx:stebullx@postgres:5432/stebullx
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
      STELLAR_USDC_ISSUER: ${STELLAR_USDC_ISSUER:-}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stebullx
      POSTGRES_PASSWORD: stebullx
      POSTGRES_DB: stebullx
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stebullx -d stebullx"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/api/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
volumes:
  postgres_data:
